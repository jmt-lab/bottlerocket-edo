# Unique project name
name: bottlerocket
# Required BuildStream version
min-version: 2.3
# Subdirectory where elements are stored
element-path: elements

# Options to specify for the project, these provide
# command line switches which control the behavior of
# conditional directives in the element.bst files
options:
    arch:
        type: arch
        description: Machine architecture
        variable: arch
        values:
        - x86_64
        - aarch64
sandbox:
    build-arch: '%{arch}'
variables:
    (?):
    - arch == "x86_64":
        go-arch: "amd64"
        systemd-arch: "x86-64"
    - arch == "aarch64":
        go-arch: "arm64"
        systemd-arch: "arm64"

plugins:
- origin: local
  path: plugins/elements
  elements:
  - rpm
  - kit
- origin: local
  path: plugins/sources
  sources:
  - vendor
  - go
  - oci
- origin: pip
  package-name: buildstream-plugins
  sources:
  - git
