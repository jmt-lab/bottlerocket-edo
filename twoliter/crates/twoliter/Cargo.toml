[package]
name = "twoliter"
version = "0.1.0"
edition = "2024"

[dependencies]
astral-tokio-tar = "0.6"
async-compression = "0.4"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-ebs = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-sdk-ec2 = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
aws-types = "1"
base16 = "0.2"
base64 = "0.22.1"
bon = "3"
clap = { version = "4", features = ["derive"] }
coldsnap = { version = "0.11", default-features = false, features = ["aws-sdk-rust-rustls"] }
edo = { git = "https://github.com/awslabs/edo", branch = "develop" }
edo-core = { git = "https://github.com/awslabs/edo", branch = "develop" }
error-utils = { path = "../error-utils" }
futures = "0.3"
indexmap = "2.14"
jiff = { version = "0.2", features = ["serde"] }
nutype = { version = "0.5", features = ["regex", "serde"] }
ocilot = "0.2"
pubsys-config = { path = "../pubsys-config" }
regex = "1"
rpm = { version = "0.18", default-features = false }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
sha2 = "0.11"
snafu = { workspace = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
test-case = "3"
