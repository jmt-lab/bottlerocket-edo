[package]
name = "br-image"
version = "0.1.0"
edition = "2024"
description = "Bottlerocket disk-image primitives: partition layout, verity, compression, RPM install, secure boot"

[dependencies]
edo = { git = "https://github.com/awslabs/edo", branch = "develop" }
regex = "1"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
sha2 = "0.11"
snafu = { workspace = true }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
