[package]
name = "twoliter"
version = "1.0.0-alpha.1"
edition = "2024"

[dependencies]
astral-tokio-tar = "0.6"
async-compression = "0.4"
async-stream = "0.3"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "credentials-process",
  "rt-tokio",
  "rustls",
  "sso"
] }
aws-credential-types = "1"
aws-sdk-ebs = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls"
] }
aws-sdk-ec2 = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls"
] }
aws-sdk-kms = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "rustls"
]}
aws-sdk-ssm = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "rustls"
]}
aws-sdk-sts = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls"
] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
aws-types = "1"
base16 = "0.2"
base64 = "0.22.1"
bon = "3"
bounded-integer = { version = "0.6", features = ["num-traits02", "serde1"] }
bytes = "1.12"
clap = { version = "4", features = ["derive"] }
coldsnap = { version = "0.12", default-features = false, features = [
  "aws-sdk-rust-rustls"
] }
duct = "1.1"
edo = { git = "https://github.com/awslabs/edo", branch = "develop" }
edo-core = { git = "https://github.com/awslabs/edo", branch = "develop" }
error-utils = "0.1"
futures = "0.3"
governor = "0.10"
handlebars = "6"
home = "0.5"
indexmap = "2.14"
indicatif = "0.18"
jiff = { version = "0.2", features = ["serde"] }
nonzero_ext = "0.3"
num_cpus = "1.17"
num-traits = "0.2"
nutype = { version = "0.5", features = ["regex", "serde"] }
ocilot = "0.2"
parse_datetime = "0.15"
regex = "1"
rpm = { version = "0.18", default-features = false }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
sha2 = "0.11"
snafu = { version = "0.9", features = ["futures"] }
tabled = "0.21"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-retry = "0.3"
tokio-stream = "0.1"
toml = "0.9"
tough = { version = "0.24", features = ["http"] }
tough-kms = "0.16"
tough-ssm = "0.19"
tracing = "0.1"
url = "2.5"
yaml_serde = "0.10"

[dev-dependencies]
maplit = "1"
test-case = "3"

[patch."https://github.com/awslabs/edo"]
edo = { path = "../../edo/crates/edo" }
edo-core = { path = "../../edo/crates/core" }

[patch.crates-io]
ocilot = { git = "https://github.com/jmt-lab/ocilot.git", branch = "fix/ecr-image"}
