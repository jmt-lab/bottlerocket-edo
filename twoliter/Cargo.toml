[workspace]
members = ["crates/twoliter", "crates/br-image"]
resolver = "2"

[workspace.dependencies]
# Shared error-handling library. Pinned here so `crates/twoliter` and
# `crates/br-image` cannot drift onto incompatible snafu versions.
snafu = "0.9"

[patch."https://github.com/awslabs/edo"]
edo = { path = "../../edo/crates/edo" }
edo-core = { path = "../../edo/crates/core" }
