schema-version = "1"

[source.code]
kind = "local"
path = "repos/bottlerocket-core-kit"
out  = "."

[transform.cargo-vendor]
kind = "cargo-vendor"
source = ["code"]
cargo-tomls = { "code" = ["sources/Cargo.toml"] }
[transform.go-vendor]
kind = "go-vendor"
source = "code"
modules = [ "sources/host-ctr" ]
[vendor.bottlerocket-core-kit]
kind = "image"
uri  = "public.ecr.aws/bottlerocket"

[requires.bottlerocket-sdk]
kind = "image"
at   = "=0.74.0"

[environment.sdk]
kind = "container"
user = "root"
source = ["bottlerocket-sdk"]

[environment.sdk-open]
kind = "container"
user = "root"
source = ["bottlerocket-sdk"]
[environment.sdk-open.config]
runtime = "podman"
network = true

