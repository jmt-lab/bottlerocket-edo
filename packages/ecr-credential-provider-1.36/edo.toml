schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/ecr-credential-provider-1.36"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "ecr-credential-provider-1.36"
depends = [
      "//packages/glibc/rpm",
]
bundled = {
    "//packages/ecr-credential-provider-1.36/bundled" = "bundled-cloud-provider-aws-1.36.0.tar.gz"
}
[transform.rpm.source]
sources = [
    "//packages/ecr-credential-provider-1.36/src",
]
archives = [
      "//packages/ecr-credential-provider-1.36/v1.36.0.tar.gz",
]
[source."v1.36.0.tar.gz"]
kind = "remote"
url  = "https://github.com/kubernetes/cloud-provider-aws/archive/refs/tags/v1.36.0.tar.gz"
ref  = "26fa3bb6be672baeec51f9abaeb5ee84a0791d5afb1a8c867e5bfb2068e939a2"
out  = "cloud-provider-aws-1.36.0.tar.gz"

[transform.bundled]
kind = "go-vendor"
environment  = "//kits/bottlerocket-core-kit/sdk-open"
source = "v1.36.0.tar.gz"
modules = ["cloud-provider-aws-1.36.0"]
