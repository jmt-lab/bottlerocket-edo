schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/policycoreutils"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "policycoreutils"
depends = [
      "//packages/glibc/rpm",
      "//packages/libselinux/rpm",
      "//packages/libsemanage/rpm",
      "//packages/libsepol/rpm",
      "//packages/libpcre/rpm",
      "//packages/libaudit/rpm"
]
[transform.rpm.source]
