schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/nvme-cli"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "nvme-cli"
depends = [
      "//packages/glibc/rpm",
      "//packages/libnvme/rpm",
]
[transform.rpm.source]
sources = [
    "//packages/nvme-cli/src",
]
archives = [
      "//packages/nvme-cli/nvme-cli-2.16.tar.gz",
]
  [source."nvme-cli-2.16.tar.gz"]
  kind = "remote"
  url  = "https://github.com/linux-nvme/nvme-cli/archive/v2.16/nvme-cli-2.16.tar.gz"
  ref  = "e2da0a833bae258edc3558cdb1fd68ab7609e8b806b4f6d9456914703af677a6"
  out  = "nvme-cli-2.16.tar.gz"
