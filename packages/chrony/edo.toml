schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/chrony"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "chrony"
depends = [
      "//packages/glibc/rpm",
      "//packages/libcap/rpm",
      "//packages/libncurses/rpm",
      "//packages/libseccomp/rpm",
      "//packages/readline/rpm",
      "//packages/libattr/rpm"
]
[transform.rpm.source]
sources = [
    "//packages/chrony/src",
]
archives = [
      "//packages/chrony/chrony-4.8.tar.gz",
      "//packages/chrony/chrony-4.8-tar-gz-asc.txt",
]
  [source."chrony-4.8.tar.gz"]
  kind = "remote"
  url  = "https://chrony-project.org/releases/chrony-4.8.tar.gz"
  ref  = "a3b8e79a9ae89442f5ab0c390cd5614d358bd85ba3b5f472228de2099fec2753"
  out  = "chrony-4.8.tar.gz"
  [source."chrony-4.8-tar-gz-asc.txt"]
  kind = "remote"
  url  = "https://chrony-project.org/releases/chrony-4.8-tar-gz-asc.txt"
  ref  = "90f880694289081cb972e11fdd6da0b7b2effd88afe39d8dfc1e44c038e0af33"
  out  = "chrony-4.8-tar-gz-asc.txt"
