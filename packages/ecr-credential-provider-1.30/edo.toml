schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/ecr-credential-provider-1.30"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "ecr-credential-provider-1.30"
depends = [
      "//packages/glibc/rpm",
]
bundled = {
    "//packages/ecr-credential-provider-1.30/bundled" = "bundled-cloud-provider-aws-1.30.10.tar.gz"
}
[transform.rpm.source]
sources = [
    "//packages/ecr-credential-provider-1.30/src",
]
archives = [
      "//packages/ecr-credential-provider-1.30/v1.30.10",
]
[source."v1.30.10"]
kind = "remote"
url  = "https://codeload.github.com/kubernetes/cloud-provider-aws/tar.gz/v1.30.10.tar.gz"
ref  = "db5b7d563de10f9aeae92e563038eab151804e3dedda1eff86f7e76118dd8a8a"
out  = "cloud-provider-aws-1.30.10.tar.gz"

[transform.bundled]
kind = "go-vendor"
environment  = "//kits/bottlerocket-core-kit/sdk-open"
source = "v1.30.10"
modules = ["cloud-provider-aws-1.30.10"]
