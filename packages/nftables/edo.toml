  out  = "nftables-1.1.6.tar.xz"
  [source."nftables-1.1.6.tar.xz.sig"]
  kind = "remote"
  url  = "https://www.netfilter.org/pub/nftables/nftables-1.1.6.tar.xz.sig"
  ref  = "72bc283c8ddbfad0fa73aa463935026ebac89c962285b7bad61862cf2f386f59"
  out  = "nftables-1.1.6.tar.xz.sig"
