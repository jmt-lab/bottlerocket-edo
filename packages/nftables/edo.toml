schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/nftables"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "nftables"
depends = [
      "//packages/glibc/rpm",
      "//packages/iptables/rpm",
      "//packages/libjansson/rpm",
      "//packages/libmnl/rpm",
      "//packages/libnftnl/rpm",
      "//packages/readline/rpm",
      "//packages/libncurses/rpm",
      "//packages/libnetfilter_conntrack/rpm",
      "//packages/libnfnetlink/rpm"
]
[transform.rpm.source]
sources = [
    "//packages/nftables/src",
]
archives = [
      "//packages/nftables/nftables-1.1.6.tar.xz",
      "//packages/nftables/nftables-1.1.6.tar.xz.sig",
]
  [source."nftables-1.1.6.tar.xz"]
  kind = "remote"
  url  = "https://www.netfilter.org/pub/nftables/nftables-1.1.6.tar.xz"
