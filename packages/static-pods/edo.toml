schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/static-pods"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "static-pods"
depends = [
      "//packages/glibc/rpm",
]
    vendored = [
        "//kits/bottlerocket-core-kit/cargo-vendor",
    ]
[transform.rpm.source]
sources = [
    "//packages/static-pods/src",
    "//kits/bottlerocket-core-kit/code",
]
archives = [
]
