  kind = "remote"
  url  = "https://mirrors.kernel.org/gnu/binutils/binutils-2.44.tar.xz"
  ref  = "85610ffef19cc45319ad23df13b1d8aaea394c42d9870aeb6b4dddcc4526be32"
  out  = "binutils-2.44.tar.xz"
  [source."binutils-2.44.tar.xz.sig"]
