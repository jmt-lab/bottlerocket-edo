environment =  "//kits/bottlerocket-core-kit/sdk"
package = "libcryptsetup"
depends = [
      "//packages/glibc/rpm",
      "//packages/libcrypto/rpm",
      "//packages/libdevmapper/rpm",
      "//packages/libpopt/rpm",
      "//packages/libselinux/rpm",
      "//packages/util-linux/rpm",
