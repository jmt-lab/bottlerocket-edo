schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/iproute"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "iproute"
depends = [
      "//packages/glibc/rpm",
      "//packages/libcap/rpm",
      "//packages/libmnl/rpm",
      "//packages/libselinux/rpm",
      "//packages/libsepol/rpm",
      "//packages/libpcre/rpm",
      "//packages/libattr/rpm"
]
[transform.rpm.source]
sources = [
    "//packages/iproute/src",
]
archives = [
      "//packages/iproute/iproute2-6.19.0.tar.xz",
      "//packages/iproute/iproute2-6.19.0.tar.sign",
]
