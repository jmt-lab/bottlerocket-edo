schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/ecr-credential-provider-1.35"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "ecr-credential-provider-1.35"
depends = [
      "//packages/glibc/rpm",
]
bundled = {
    "//packages/ecr-credential-provider-1.35/bundled" = "bundled-cloud-provider-aws-1.35.1.tar.gz"
}
[transform.rpm.source]
sources = [
    "//packages/ecr-credential-provider-1.35/src",
]
archives = [
      "//packages/ecr-credential-provider-1.35/v1.35.1.tar.gz",
]
[source."v1.35.1.tar.gz"]
kind = "remote"
url  = "https://github.com/kubernetes/cloud-provider-aws/archive/refs/tags/v1.35.1.tar.gz"
ref  = "f06fdf2570876428405f0daa4b28e5169ec784dc8ae0c1d2f8a4a3907bdaa29e"
out  = "cloud-provider-aws-1.35.1.tar.gz"

[transform.bundled]
kind = "go-vendor"
environment  = "//kits/bottlerocket-core-kit/sdk-open"
source = "v1.35.1.tar.gz"
modules = ["cloud-provider-aws-1.35.1"]
