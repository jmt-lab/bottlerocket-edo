schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/rocm-container-toolkit"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "rocm-container-toolkit"
depends = [
      "//packages/glibc/rpm",
]
bundled = {
    "//packages/rocm-container-toolkit/bundled" = "bundled-container-toolkit-1.2.0.tar.gz"
}

[transform.rpm.source]
sources = [
    "//packages/rocm-container-toolkit/src",
]
archives = [
      "//packages/rocm-container-toolkit/v1.2.0.tar.gz",
]
[source."v1.2.0.tar.gz"]
kind = "remote"
url  = "https://github.com/ROCm/container-toolkit/archive/v1.2.0.tar.gz"
ref  = "22e060a34c21dcb304cb7f664438179b0a4e478e2e6be28e420db4536e0ab855"
out  = "container-toolkit-1.2.0.tar.gz"


[transform.bundled]
kind = "go-vendor"
environment = "//kits/bottlerocket-core-kit/sdk-open"
source = "v1.2.0.tar.gz"
modules = [ "container-toolkit-1.2.0" ]
