schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/libsemanage"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "libsemanage"
depends = [
      "//packages/glibc/rpm",
      "//packages/libaudit/rpm",
      "//packages/libselinux/rpm",
      "//packages/libsepol/rpm",
      "//packages/libpcre/rpm"
]
[transform.rpm.source]
sources = [
    "//packages/libsemanage/src",
]
archives = [
      "//packages/libsemanage/libsemanage-3.8.1.tar.gz",
      "//packages/libsemanage/libsemanage-3.8.1.tar.gz.asc",
]
  [source."libsemanage-3.8.1.tar.gz"]
  kind = "remote"
