schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/notation"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "notation"
depends = [
      "//packages/glibc/rpm",
]
bundled = {
    "//packages/notation/bundled" = "bundled-notation-v1.3.2.tar.gz"
}
[transform.rpm.source]
sources = [
    "//packages/notation/src",
]
archives = [
      "//packages/notation/notation-v1.3.2.tar.gz",
]
[source."notation-v1.3.2.tar.gz"]
kind = "remote"
url  = "https://github.com/notaryproject/notation/archive/v1.3.2/notation-v1.3.2.tar.gz"
ref  = "c483b1247141b41d96a42bac8f477f25435178f08d2e6151762841a982c32825"
out  = "notation-v1.3.2.tar.gz"

[transform.bundled]
kind   = "go-vendor"
environment = "//kits/bottlerocket-core-kit/sdk-open"
source = "notation-v1.3.2.tar.gz"
modules = [ "notation-1.3.2" ]
