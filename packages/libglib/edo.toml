      "//packages/libglib/glib-2.86.5.tar.xz",
]
  [source."glib-2.86.5.tar.xz"]
  kind = "remote"
  url  = "https://download.gnome.org/sources/glib/2.86/glib-2.86.5.tar.xz"
  ref  = "c68e54dfe47744bfd0307179847574445f6e88490f8856fcdf90e59eaa57e3f8"
  out  = "glib-2.86.5.tar.xz"
