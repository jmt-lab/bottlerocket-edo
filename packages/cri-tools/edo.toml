schema-version = "1"
[source.src]
kind    = "local"
path    = "repos/bottlerocket-core-kit/packages/cri-tools"
out     = "."
[transform.rpm]
kind    = "rpm"
environment =  "//kits/bottlerocket-core-kit/sdk"
package = "cri-tools"
depends = [
      "//packages/glibc/rpm",
]
bundled = {
    "//packages/cri-tools/bundled" = "bundled-cri-tools-1.35.0.tar.gz"
}
[transform.rpm.source]
sources = [
    "//packages/cri-tools/src",
]
archives = [
      "//packages/cri-tools/cri-tools-1.35.0.tar.gz",
]
[source."cri-tools-1.35.0.tar.gz"]
kind = "remote"
url  = "https://github.com/kubernetes-sigs/cri-tools/archive/v1.35.0/cri-tools-1.35.0.tar.gz"
ref  = "56b5c4aa60e314b4e2e9909e5b98f0e035c856034db2aca8b65318a5516e4910"
out  = "cri-tools-1.35.0.tar.gz"
[transform.bundled]
kind = "go-vendor"
environment = "//kits/bottlerocket-core-kit/sdk-open"
source = "cri-tools-1.35.0.tar.gz"
modules = ["cri-tools-1.35.0"]
